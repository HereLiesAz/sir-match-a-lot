# Dependabot version updates: Gradle dependencies (gradle/libs.versions.toml and
# the build scripts) and the GitHub Actions used by the workflows, checked weekly.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

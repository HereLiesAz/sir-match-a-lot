name: Android CI

# Runs unit tests and Android lint on every push/PR, builds a debug APK, and —
# only on a push to main — publishes that APK as the rolling
# "latest-debug-vMAJOR.MINOR" prerelease.
# Signed release builds are NOT made here; they run centrally via
# android-github-release.yml / android-play-release.yml.
# Reads the version from version.properties (versionMajor/Minor/Patch/Build).
#
# Optional secrets (Google Services injection — skipped if template absent):
#   GOOGLE_SERVICES_API_KEY  — Firebase/Google API key
#   PROJECT_ID               — Firebase project ID
#   CLIENT_ID                — OAuth client ID
#
# No signing secrets are used: debug builds use the default debug key.
# Each job gets the least privilege it needs; the default is read-only.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # dependency-graph submission
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          if [ -f "app/google-services.json.template" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --continue --build-cache --no-daemon --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write     # "Report Failure to Jules" opens an issue

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          if [ -f "app/google-services.json.template" ]; then
            echo "Template found. Injecting secrets..."
            sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
          else
            echo "google-services.json.template not found. Skipping injection."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Build debug APK
        id: gradle-build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          exit $EXIT_CODE

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
              body: `/jules debug this build error\n\n**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: build
    # Only a push to the default branch publishes; feature branches and PRs never do.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the tag and edit the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Prepare Release Variables
        run: |
          MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER=$(grep '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          VERSION_NAME="$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER"
          TAG_NAME="latest-debug-v${MAJOR}.${MINOR}"
          APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          APK_ORIGINAL=$(find apk -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: No APK found to release!"
            exit 1
          fi
          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-debug.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "APK_FILE=$TARGET_NAME" >> "$GITHUB_ENV"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG_NAME" -m "Latest Debug Build"
          git push origin "$TAG_NAME" --force
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release edit "$TAG_NAME" --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA" \
              --target "$GITHUB_SHA"
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG_NAME" "$APK_FILE" --prerelease \
              --title "Latest Debug Build ($TAG_NAME)" \
              --notes "Auto-build from commit $GITHUB_SHA" \
              --target "$GITHUB_SHA"
          fi
